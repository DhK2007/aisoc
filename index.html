<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>HUMAN × AI: Venture Lab | LSE AI Society</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#070B1F;--surf:rgba(255,255,255,.045);--surf2:rgba(255,255,255,.08);--line:rgba(255,255,255,.11);--line2:rgba(255,255,255,.22);--tx:#F4F6FF;--mut:#AAB2D0;--pur:#8B6CFF;--teal:#2DD4BF;--teal2:#5EEAD4;--amb:#FBBF24;--red:#FB7185;--r:16px;--hd:'Bricolage Grotesque','Hanken Grotesk',system-ui,sans-serif;--bd:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 90px);background:var(--bg)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font-family:var(--bd);font-size:17px;line-height:1.55;color:var(--tx);min-height:100vh;-webkit-font-smoothing:antialiased;background:radial-gradient(900px 520px at 88% -8%,rgba(139,108,255,.24),transparent 62%),radial-gradient(760px 520px at -8% 18%,rgba(45,212,191,.13),transparent 62%),var(--bg)}
h1,h2,h3,h4{font-family:var(--hd);letter-spacing:-.02em;line-height:1.1;margin:0}
h1{font-size:clamp(2.5rem,6vw,4.8rem);font-weight:700}
h2{font-size:clamp(1.8rem,3.4vw,2.5rem);font-weight:700}
h3{font-size:1.2rem;font-weight:600;line-height:1.25}
h4{font-size:1rem;font-weight:600}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px}
.narrow{max-width:820px}
.lead{font-size:clamp(1.05rem,1.8vw,1.3rem);color:var(--mut);max-width:58ch;margin-top:12px}
.hint{color:var(--mut);font-size:.92rem}.mut{color:var(--mut)}.tn{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.pos{color:var(--teal2)}.neg{color:#FF9FB0}
/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:rgba(7,11,31,.84);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:14px;padding:8px 20px;max-width:1240px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--hd);font-weight:700;font-size:1.05rem;white-space:nowrap;background:none;border:0;cursor:pointer;padding:0;text-align:left;line-height:1.15}
.brand img{height:44px;width:auto;display:block}
.brand small{display:block;font-family:var(--bd);font-weight:500;font-size:.72rem;color:var(--mut)}
.steps{display:flex;gap:2px;list-style:none;margin:0 auto;padding:0;align-items:center}
.step{display:flex;align-items:center;gap:8px;background:none;border:1px solid transparent;border-radius:10px;padding:6px 10px;color:var(--mut);cursor:pointer;min-height:40px;white-space:nowrap;font-size:.92rem}
.step .n{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;border:1px solid var(--line2);font-size:.8rem;font-weight:700}
.step.done{color:var(--tx)}.step.done .n{background:var(--teal);border-color:var(--teal);color:#04141A}
.step.cur{color:var(--tx);background:var(--surf2);border-color:var(--line2)}.step.cur .n{background:var(--pur);border-color:var(--pur);color:#fff}
.step:disabled{opacity:.4;cursor:not-allowed}
.bar{height:3px;background:var(--line);position:relative}.bar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--pur),var(--teal));transition:width .5s}
.right{display:flex;align-items:center;gap:10px;margin-left:auto}
.timer{padding:5px 12px;border-radius:99px;border:1px solid var(--line2);background:var(--surf);font-variant-numeric:tabular-nums;font-weight:600;font-size:.95rem;white-space:nowrap}
.timer.warn{color:var(--amb);border-color:rgba(251,191,36,.5)}.timer.zero{color:#FF9FB0;border-color:var(--red)}
/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line2);background:var(--surf2);padding:10px 18px;border-radius:12px;font-weight:600;cursor:pointer;transition:border-color .18s,transform .18s;min-height:46px;text-decoration:none}
.btn:hover{border-color:var(--teal)}
.btn.pri{background:linear-gradient(135deg,#7C5CFF,#5B3FE0);border-color:transparent;box-shadow:0 10px 30px -12px rgba(124,92,255,.9)}
.btn.acc{background:var(--teal);color:#04141A;border-color:transparent}
.btn.sm{min-height:38px;padding:6px 13px;font-size:.92rem;border-radius:10px}
.btn.big{min-height:56px;padding:12px 30px;font-size:1.1rem}
.btn.danger{border-color:rgba(251,113,133,.55);color:#FFB8C3}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;color:var(--mut);text-decoration:underline;cursor:pointer;padding:4px;font-size:inherit}
.link:hover{color:var(--tx)}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.lb{display:block;font-weight:600;margin-bottom:6px}
.inp{width:100%;background:rgba(5,8,24,.62);border:1px solid var(--line2);border-radius:12px;padding:11px 14px;min-height:48px}
textarea.inp{resize:vertical;min-height:84px;line-height:1.45}
.inp:focus{outline:2px solid var(--teal);outline-offset:1px;border-color:transparent}
.inp[aria-invalid=true]{border-color:var(--red)}
.err{color:#FF9FB0;font-size:.93rem;min-height:1.3em;margin-top:5px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 11px;border-radius:99px;border:1px solid var(--line2);font-size:.82rem;color:var(--mut);white-space:nowrap}
.chip.demo{color:#FDE08A;border-color:rgba(251,191,36,.5)}.chip.live{color:#9FF0C0;border-color:rgba(74,222,128,.5)}.chip.win{color:var(--teal2);border-color:rgba(45,212,191,.55)}.chip.sample{color:#C9BBFF;border-color:rgba(139,108,255,.6)}
.card{background:linear-gradient(180deg,var(--surf2),var(--surf));border:1px solid var(--line);border-radius:var(--r);padding:22px}
.note{border-left:3px solid var(--teal);padding:10px 14px;background:rgba(45,212,191,.07);border-radius:0 10px 10px 0;color:var(--mut);font-size:.95rem}
.note.warn{border-color:var(--amb);background:rgba(251,191,36,.07)}
.sec{padding:34px 0 20px}
.sec-head{margin-bottom:22px}
.foot{padding:30px 20px 50px;color:var(--mut);font-size:.88rem;text-align:center;display:grid;gap:8px}
.screen.in{animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* welcome */
.hero{display:grid;gap:18px;justify-items:start;padding-top:40px;max-width:760px}
.hero .logo-big{height:104px;width:auto;margin-bottom:6px}
.start{display:grid;gap:16px;width:100%;max-width:520px;margin-top:10px}
.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:36px 0 10px}
.flow .card{padding:16px}.flow b{font-family:var(--hd);font-size:1.05rem;display:block;margin:6px 0 2px}.flow p{font-size:.9rem;color:var(--mut)}.flow .n{color:var(--teal2);font-family:var(--hd);font-size:1.3rem}
/* stage 1 */
.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.ccard{text-align:left;cursor:pointer;display:grid;gap:6px;border-radius:var(--r);border:1px solid var(--line);background:linear-gradient(180deg,var(--surf2),var(--surf));padding:20px;position:relative;transition:border-color .2s,transform .2s;min-height:110px}
.ccard:hover{transform:translateY(-2px);border-color:var(--line2)}
.ccard[aria-checked=true]{border-color:var(--teal);box-shadow:0 0 0 1px var(--teal)}
.ccard p{color:var(--mut);font-size:.96rem}.ccard .tick{position:absolute;right:14px;top:14px;width:24px;height:24px;border-radius:50%;background:var(--teal);color:#04141A;display:none;place-items:center;font-weight:700}
.ccard[aria-checked=true] .tick{display:grid}
/* stage 2 */
.qs{display:grid;gap:18px}
.q .ex{color:var(--mut);font-size:.93rem;margin-top:6px}.q .ex b{color:var(--teal2);font-weight:600}
.q .hnt{margin-top:6px;font-size:.93rem;background:rgba(139,108,255,.12);border-radius:10px;padding:8px 12px}
.fh{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
/* stage 3 chat */
.mini{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 18px;padding:0;list-style:none}
.mini li{padding:5px 12px;border-radius:99px;border:1px solid var(--line2);font-size:.88rem;color:var(--mut)}
.mini li.cur{background:var(--pur);border-color:var(--pur);color:#fff}.mini li.done{border-color:var(--teal);color:var(--teal2)}
.thread{display:grid;gap:14px}
.msg{display:flex;gap:10px;max-width:100%}
.msg.team{justify-content:flex-end}
.av{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--hd);font-weight:700;font-size:.8rem;background:linear-gradient(135deg,var(--pur),var(--teal));color:#05101C}
.bub{background:var(--surf2);border:1px solid var(--line);border-radius:4px 16px 16px 16px;padding:14px 16px;max-width:min(680px,100%);display:grid;gap:10px}
.msg.team .bub{background:rgba(139,108,255,.2);border-color:rgba(139,108,255,.5);border-radius:16px 4px 16px 16px}
.bub .who{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.85rem;color:var(--mut)}
.bub ul{margin:0;padding-left:20px;display:grid;gap:4px}
.fbk{display:grid;gap:10px}.fbk div{border-left:3px solid var(--line2);padding-left:12px}.fbk b{display:block;font-size:.86rem;color:var(--teal2)}
.fbk .weak{border-color:var(--amb)}.fbk .weak b{color:#FDE08A}
.alt{border:1px solid var(--line2);border-radius:12px;padding:12px;display:grid;gap:6px;background:rgba(5,8,24,.4)}
.typing{display:flex;gap:5px;padding:6px 2px}.typing i{width:8px;height:8px;border-radius:50%;background:var(--teal2);animation:bl 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,100%{opacity:.25}50%{opacity:1}}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.act{text-align:left;cursor:pointer;border:1px solid var(--line2);background:var(--surf);border-radius:14px;padding:14px;display:grid;gap:3px;min-height:84px}
.act b{font-size:1rem}.act span{font-size:.88rem;color:var(--mut)}.act[aria-checked=true]{border-color:var(--teal);background:rgba(45,212,191,.1)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.chips button{background:rgba(139,108,255,.12);border:1px solid rgba(139,108,255,.4);border-radius:99px;padding:6px 13px;cursor:pointer;font-size:.9rem;text-align:left}
.chips button:hover{border-color:var(--teal)}
.sbs{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.sbs>div{background:rgba(5,8,24,.45);border:1px solid var(--line);border-radius:14px;padding:14px}
.sbs h4{margin-bottom:6px;color:var(--teal2)}
mark{background:rgba(45,212,191,.25);color:var(--tx);border-radius:4px;padding:0 2px}
.list3{display:grid;gap:12px}.list3 h4{font-size:.92rem;margin-bottom:4px}
.loader{display:grid;gap:12px;place-items:center;text-align:center;padding:40px 10px}
.spin{width:38px;height:38px;border-radius:50%;border:3px solid var(--line2);border-top-color:var(--teal);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* stage 4 */
.form{display:grid;gap:18px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.models{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.mo{text-align:left;background:var(--surf);border:1px solid var(--line2);border-radius:12px;padding:10px 12px;cursor:pointer;display:grid;gap:2px;min-height:56px}
.mo b{font-size:.95rem}.mo span{font-size:.8rem;color:var(--mut)}.mo[aria-checked=true]{border-color:var(--teal);background:rgba(45,212,191,.1)}
.rev{font-family:var(--hd);font-size:1.5rem;font-weight:700;color:var(--teal2)}
details>summary{cursor:pointer;font-weight:600;min-height:36px}
/* gallery */
.tabs{display:flex;gap:6px;flex-wrap:wrap}.tabs button{border:1px solid var(--line2);background:var(--surf);padding:9px 20px;border-radius:99px;cursor:pointer;font-weight:600;min-height:46px}.tabs button[aria-selected=true]{background:var(--pur);border-color:var(--pur);color:#fff}
.tools{display:flex;gap:12px;flex-wrap:wrap;align-items:end;margin:16px 0}.tools label{font-size:.85rem;color:var(--mut);display:block;margin-bottom:3px}.tools select{min-height:42px;background:rgba(5,8,24,.62);border:1px solid var(--line2);border-radius:10px;padding:6px 10px}
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.gcard{text-align:left;cursor:pointer;display:grid;gap:10px;align-content:start;border:1px solid var(--line);background:linear-gradient(180deg,var(--surf2),var(--surf));border-radius:var(--r);padding:18px;transition:border-color .2s,transform .2s}
.gcard:hover{border-color:var(--teal);transform:translateY(-2px)}
.gc-top{display:flex;gap:12px;align-items:center}.gc-top h3{font-size:1.15rem}
.score{margin-left:auto;text-align:right;line-height:1}.score b{font-family:var(--hd);font-size:1.7rem}.score span{display:block;font-size:.7rem;color:var(--mut)}
.src{margin:14px 0;font-size:.93rem}
.bars{display:grid;gap:10px}.bars .fl{display:flex;justify-content:space-between;font-size:.92rem}
.meter{height:8px;background:var(--line);border-radius:6px;overflow:hidden}.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--pur),var(--teal))}
.awards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:20px}
.award{padding:14px 16px;border:1px solid var(--line2);border-radius:14px;background:var(--surf)}.award h4{color:var(--teal2);font-size:.92rem}.award p{margin-top:4px;font-weight:600}
.rk{display:grid;grid-template-columns:42px 1fr auto;gap:14px;align-items:center;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--surf);margin-bottom:10px;cursor:pointer;width:100%;text-align:left}
.rk.top1{border-color:var(--teal);background:linear-gradient(135deg,rgba(124,92,255,.22),rgba(45,212,191,.12))}
.rk .pn{font-family:var(--hd);font-size:1.5rem;color:var(--teal2)}.rk .sc{font-family:var(--hd);font-size:1.6rem;font-weight:700}
/* overlays */
.modal-bg{position:fixed;inset:0;z-index:80;background:rgba(3,5,16,.74);display:grid;place-items:center;padding:16px;backdrop-filter:blur(4px)}
.modal{background:#0B1230;border:1px solid var(--line2);border-radius:18px;padding:24px;max-width:560px;width:100%;display:grid;gap:14px;max-height:92vh;overflow:auto}
.modal.wide{max-width:900px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);opacity:0;background:#10183C;border:1px solid var(--teal);padding:10px 18px;border-radius:12px;z-index:90;transition:.3s;pointer-events:none;max-width:90vw}
.toast.show{opacity:1;transform:translate(-50%,0)}
.tests li{margin:3px 0}.tests .ok{color:#9FF0C0}.tests .bad{color:#FF9FB0}
code{background:rgba(255,255,255,.1);padding:1px 6px;border-radius:6px;font-size:.9em}
.hgrid{display:grid;grid-template-columns:1.1fr 1fr;gap:18px;align-items:start}.ht td,.ht th{text-align:left}
#present:fullscreen{background:var(--bg);padding:30px;overflow:auto}
.banner{position:fixed;z-index:50;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(860px,calc(100% - 28px));background:linear-gradient(135deg,#2A1B73,#0B2F3A);border:1px solid var(--line2);border-radius:18px;padding:16px 20px;display:flex;gap:14px;align-items:center;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.banner p{font-family:var(--hd);font-size:clamp(1.05rem,2.2vw,1.5rem);flex:1;line-height:1.25}
.winner{text-align:center;display:grid;gap:8px;justify-items:center}.winner h2{font-size:clamp(1.8rem,5vw,3rem)}
[hidden]{display:none!important}
@media (max-width:900px){.hgrid{grid-template-columns:1fr}.step span.t{display:none}.flow{grid-template-columns:1fr 1fr}}
@media (max-width:640px){.acts,.sbs,.two,.flow{grid-template-columns:1fr}.top-in{gap:8px;padding:6px 12px;flex-wrap:wrap}.steps{order:3;width:100%;justify-content:space-between;margin:0}.brand small{display:none}.brand img{height:36px}.wrap{padding:0 14px}.card{padding:16px}.rk{grid-template-columns:34px 1fr}.rk .sc{grid-column:2}body{font-size:16px}.hero .logo-big{height:84px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<noscript><p style="padding:20px">HUMAN × AI: Venture Lab needs JavaScript. Please enable it and reload.</p></noscript>
<header class="top">
  <div class="top-in">
    <button class="brand" data-act="home" aria-label="LSE AI Society, HUMAN × AI Venture Lab, back to the start">
      <img id="brandLogo" alt="LSE AI Society logo" height="44">
      <span id="brandText">HUMAN × AI<small>Venture Lab · LSE AI Society</small></span>
    </button>
    <nav aria-label="Progress"><ol class="steps" id="steps"></ol></nav>
    <div class="right"><div class="timer" id="timer" role="timer" aria-label="Time remaining"><span id="tVal">20:00</span></div></div>
  </div>
  <div class="bar" aria-hidden="true"><i id="barFill" style="width:0"></i></div>
</header>
<main id="screen" class="screen" tabindex="-1"></main>
<footer class="foot">
  <p>LSE AI Society workshop. Ratings and feedback in demo mode come from a simple rule-based tool, not a live AI model. AI can be wrong, so you decide.</p>
  <p><button class="link" data-act="organiser">Organiser settings</button> · <button class="link" data-act="resetAsk">Start over</button></p>
</footer>
<div id="modalRoot"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div id="bannerRoot"></div>

<script>window.VENTURE_MODE='student';</script>
<script src="config.js"></script>
<script>
(()=>{
'use strict';
/* =====================================================================
   CONFIGURATION lives in config.js (next to this file), which sets window.VENTURE_CONFIG:
     SHARED_URL      Google Apps Script web app address (see Code.gs). Empty = demo mode on each device.
     AI_BACKEND_URL  Optional address of YOUR OWN server that calls a real AI model. Empty = demo AI.
   API keys must live only on that server, never in these files. AI endpoints expected there:
     POST {AI_BACKEND_URL}/ai/feedback  {challenge, who, pain, solution, idea}               -> {promising, weak, assumption, question}
     POST {AI_BACKEND_URL}/ai/followup  {action, text, challenge, who, pain, solution, idea}  -> {text, items?:[], alternatives?:[{label,text,why,risk}]}
     POST {AI_BACKEND_URL}/ai/compare   {original, revised, challenge}                        -> {improved:[], notImproved:[], human:[]}
     POST {AI_BACKEND_URL}/ai/judge     {card, collaboration}                                 -> {scores:{problem,originality,ai,feasibility}, evaluation, strength, weakness, suggestion, verdict}

/* ============ utilities ============ */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const hash=s=>{let h=2166136261;for(const ch of String(s)){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const r1=x=>Math.round(x*10)/10;
const num=(n,d=0)=>isFinite(n)?(Math.round(n*10**d)/10**d).toLocaleString('en-GB',{maximumFractionDigits:d}):'n/a';
const gbp=n=>isFinite(n)?'£'+Math.round(n).toLocaleString('en-GB'):'n/a';
const clean=s=>String(s||'').trim().replace(/\s+/g,' ').replace(/[.!?]+(\s+|$)/g,(m,sp)=>sp?', ':'').replace(/,\s*,/g,',').replace(/,\s*$/,'');
const lc=s=>{s=clean(s);return s.charAt(0).toLowerCase()+s.slice(1)};
const cap=s=>{s=clean(s);return s.charAt(0).toUpperCase()+s.slice(1)};
const short=(s,n=60)=>{s=clean(s);if(s.length<=n)return s;const t=s.slice(0,n),i=t.lastIndexOf(' ');return t.slice(0,i>20?i:n)+'…'};
const STOP=new Set('the and for with that this are was were from have has had you your our their they them his her its but not can will would could should into onto than then also very more most some any all one two out who what when where why how because about over under just only such like make made use used using get got able want need needs'.split(' '));
const toks=s=>[...new Set(String(s||'').toLowerCase().match(/[a-z]{3,}/g)||[])].filter(w=>!STOP.has(w));
const jac=(a,b)=>{const A=new Set(a),B=new Set(b);let i=0;A.forEach(x=>B.has(x)&&i++);const u=A.size+B.size-i;return u?i/u:1};
const cover=(a,b)=>{const A=new Set(a);let i=0;b.forEach(x=>A.has(x)&&i++);return b.length?i/b.length:0};
const pick=(a,s)=>a[s%a.length];
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),3200)}
let lastFocus=null;
function modal(html,wide){lastFocus=document.activeElement;$('#modalRoot').innerHTML=`<div class="modal-bg" data-act="mbg"><div class="modal ${wide?'wide':''}" role="dialog" aria-modal="true" tabindex="-1">${html}</div></div>`;const d=$('.modal');(d.querySelector('[data-focus]')||d).focus()}
function closeModal(){$('#modalRoot').innerHTML='';if(lastFocus&&lastFocus.focus)lastFocus.focus()}
function confirmBox(title,body,ok,fn){modal(`<h3>${esc(title)}</h3><p class="mut">${esc(body)}</p><div class="row"><button class="btn danger" data-act="mok" data-focus>${esc(ok)}</button><button class="btn" data-act="mclose">Cancel</button></div>`);confirmBox.fn=fn}
function copyText(t){return(navigator.clipboard&&window.isSecureContext?navigator.clipboard.writeText(t):Promise.reject()).catch(()=>{const a=document.createElement('textarea');a.value=t;a.style.cssText='position:fixed;opacity:0';document.body.appendChild(a);a.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}a.remove();if(!ok)throw new Error('copy failed')})}
const autosize=t=>{t.style.height='auto';t.style.height=Math.min(t.scrollHeight+2,380)+'px'};

function buildSub(card,collab,jr,extra){

const SUBKEY='human-ai-venture-lab-v2-submissions',STATEKEY=MODE==='host'?'human-ai-venture-lab-v2-host':'human-ai-venture-lab-v2-progress';

const Store={
 list(){try{const a=JSON.parse(localStorage.getItem(SUBKEY)||'[]');return Array.isArray(a)?a:[]}catch(e){return[]}},
 write(a){try{localStorage.setItem(SUBKEY,JSON.stringify(a));return true}catch(e){return false}},
 upsert(sub){const a=this.list(),i=a.findIndex(x=>x.id===sub.id);let updated=false;if(i>=0){sub.revision=(a[i].revision||1)+1;a[i]=sub;updated=true}else{sub.revision=1;a.push(sub)}this.write(a);return updated},
 merge(incoming){const rep={added:0,updated:0,skipped:0,invalid:0},a=this.list();
  (Array.isArray(incoming)?incoming.slice(0,300):[]).forEach(x=>{
   if(!x||typeof x.id!=='string'||typeof x.name!=='string'||typeof x.teamName!=='string'||!x.scores||!RUBRIC.every(c=>isFinite(x.scores[c.k]))){rep.invalid++;return}
   if(x.sample||String(x.id).startsWith('sample-')){rep.skipped++;return}
   const sc={};RUBRIC.forEach(c=>sc[c.k]=r1(clamp(+x.scores[c.k],0,10)));
   const sub={...x,scores:sc,overall:weighted(sc),sample:false,revision:x.revision||1,collabScore:isFinite(x.collabScore)?clamp(+x.collabScore,0,10):2};
   const i=a.findIndex(y=>y.id===sub.id);
   if(i>=0){if((sub.submittedAt||0)>(a[i].submittedAt||0)){a[i]=sub;rep.updated++}else rep.skipped++;return}
   if(a.some(y=>chash(y)===chash(sub))){rep.skipped++;return}
   a.push(sub);rep.added++});
  this.write(a);return rep}};

function fbBlock(f,mode){return bubAI(`<div class="fbk"><div><b>What’s promising</b>${esc(f.promising)}</div><div class="weak"><b>What’s unclear or weak</b>${esc(f.weak)}</div><div><b>An assumption you may be making</b>${esc(f.assumption)}</div><div><b>A question to consider</b>${esc(f.question)}</div></div><p class="hint">This is one opinion. You’re free to disagree.</p>`,mode)}

 <div><label class="lb" for="hMsgSel">Message to every screen</label><select id="hMsgSel" data-sel="hmsg" class="inp" style="margin-bottom:8px"><option value="">Choose a discussion prompt…</option>${PROMPTS.map(p=>`<option>${esc(p)}</option>`).join('')}</select><input id="hMsg" class="inp" maxlength="180" placeholder="Or type your own message" value="${esc(S.message||'')}"><div class="row" style="margin-top:8px"><button class="btn sm acc" data-act="hMsgSend">Show on all screens</button><button class="btn sm" data-act="hMsgClear">Clear</button></div></div>
 <div class="row" style="margin-top:16px"><button class="btn sm" data-act="hExport">Export all submissions</button><button class="btn sm danger" data-act="hClear">Clear all teams and submissions</button></div>`}
function hostRes(){const list=gal.remote;return `<div class="tabs" role="tablist"><button role="tab" aria-selected="${state.galTab!=='gallery'}" data-act="galTab" data-k="board">Leaderboard</button><button role="tab" aria-selected="${state.galTab==='gallery'}" data-act="galTab" data-k="gallery">Gallery</button></div><div id="present">${state.galTab==='gallery'?vGrid(list):`<div class="row" style="margin:14px 0"><button class="btn pri" data-act="hWinner">Announce the winner</button><button class="btn" data-act="hPresent">Present full screen</button></div>${vBoard(list)}`}</div>`}
function hostFill(force){if(!$('#hCtl'))return;const S=Sync.state||HSTATE0(),conn=$('#hConn');
 conn.textContent=Sync.ok===false?'Connection problem: '+Sync.err:Sync.ok?'Connected, live':'Connecting…';conn.className='chip '+(Sync.ok===false?'demo':Sync.ok?'live':'');
 const cs=JSON.stringify([S.phase,S.total,S.revealed,S.message,S.msgId]);if(force||cs!==hSig.c){hSig.c=cs;$('#hCtl').innerHTML=hostCtl(S)}
 const ids=new Set(gal.remote.map(s=>s.id)),now=Date.now()+Sync.offset,T=[...Sync.teams].sort((a,b)=>(b.seen||0)-(a.seen||0));
 $('#hLive').innerHTML=`<div class="fh"><h3>Teams</h3><span class="hint">${T.length} joined · ${gal.remote.length} submitted</span></div>${T.length?`<div class="tscroll"><table class="ht"><thead><tr><th>Team</th><th>Where they are</th><th>Last seen</th><th>Status</th></tr></thead><tbody>${T.map(t=>{const ago=Math.max(0,Math.round((now-(t.seen||0))/1000));return `<tr><td>${esc(t.name)}</td><td>${esc(WHERE[t.stage||0]||'')}</td><td>${ago<60?ago+'s ago':Math.round(ago/60)+' min ago'}</td><td>${ids.has(t.id)?'<span class="chip live">Submitted</span>':ago>45?'<span class="chip">Away?</span>':'<span class="chip">Working</span>'}</td></tr>`}).join('')}</tbody></table></div>`:'<p class="mut" style="margin-top:8px">No teams yet. Share the student link and ask teams to press Start.</p>'}`;
 const rs=JSON.stringify([gal.remote.map(s=>s.id+':'+s.revision+':'+s.submittedAt),state.galTab,state.filter,state.sort]);if(force||rs!==hSig.r){hSig.r=rs;$('#hResWrap').innerHTML=hostRes()}}
function hostUpdate(){if(state.screen==='host'&&$('#hCtl'))hostFill(false)}
async function hostCall(body,msg){try{await Sync.post({...body,key:Sync.key});if(msg)toast(msg);await poll()}catch(e){toast('Host action failed: '+e.message);if(/host key/i.test(e.message)){Sync.key='';try{sessionStorage.removeItem('vl-host-key')}catch(x){}render()}}}
function showWinner(){const R=rankList(gal.remote).filter(x=>x.r===1).map(x=>x.s);if(!R.length||!(R[0].overall>0)){toast('No scored submissions yet.');return}
 modal(`<div class="winner"><p class="mut">The highest score goes to</p><div style="transform:scale(2);margin:22px">${mark(R[0].name)}</div><h2>${R.map(s=>esc(s.name)).join(' and ')}</h2><p class="mut">${R.map(s=>esc(s.teamName)).join(', ')}</p><p class="total tn" style="font-family:var(--hd);font-size:2.4rem;font-weight:700">${num(R[0].overall,1)} / 10</p><p class="hint">A demo rating from one fixed rubric. Every team also shines somewhere: see the category awards.</p><button class="btn pri" data-act="mclose" data-focus>Close</button></div>`)}

/* ============ self-tests ============ */
function runTests(){const T=[],t=(name,pass,info)=>T.push({name,pass:!!pass,info});
 t('Weighted score: 8, 6, 7, 5 gives 6.5',weighted({problem:8,originality:6,ai:7,feasibility:5})===6.5);
 t('Weighted score: all 10 gives 10',weighted({problem:10,originality:10,ai:10,feasibility:10})===10);
 t('Weighted score: 7.3, 6.1, 8.4, 5.5 gives 6.8',weighted({problem:7.3,originality:6.1,ai:8.4,feasibility:5.5})===6.8);
 t('Rubric weights sum to 100%',Math.abs(RUBRIC.reduce((a,c)=>a+c.w,0)-1)<1e-9);
 const base={ch:'living',name:'Alpha',customer:'First-year students in shared flats',problem:'Bills cause stress and cost them money each month',solution:'An AI that predicts next month’s bills from receipts and flags problems, with housemates approving suggestions',model:'subscription',price:4,customers:150,risk:'Receipts might not be scanned'};
 const a=demoJudge(base,null),b=demoJudge({...base},null);
 t('Judge is deterministic',JSON.stringify(a)===JSON.stringify(b));
 const c=demoJudge({...base,name:'Zzzz Extremely Long Fancy Startup Name Incorporated'},null);
 t('Team or startup name does not change scores',JSON.stringify(a.scores)===JSON.stringify(c.scores));
 const pad=' lorem ipsum dolor sit amet consectetur sed tempor incididunt labore magna aliqua enim minim veniam quis nostrud'.repeat(8);
 const d=demoJudge({...base,problem:base.problem+pad,solution:base.solution+pad,customer:base.customer+pad},null);
 t('Padding with filler text does not raise scores',RUBRIC.every(x=>d.scores[x.k]<=a.scores[x.k]+1e-9),JSON.stringify(d.scores));
 t('Overall equals weighted average of categories',a.overall===weighted(a.scores));
 t('All scores within 0 to 10',RUBRIC.every(x=>a.scores[x.k]>=0&&a.scores[x.k]<=10)&&a.overall<=10);
 const vague=demoJudge({ch:'admin',name:'X',customer:'Students',problem:'University is hard',solution:'A chatbot that answers questions about university',model:'subscription',price:25,customers:5000,risk:'Competition'},null);
 t('A vague chatbot idea scores lower than a specific AI idea',vague.overall<a.overall,vague.overall+' vs '+a.overall);
 const sent=x=>(x.match(/[.!?](\s|$)/g)||[]).length;
 t('Evaluation has exactly three sentences for all samples',SAMPLES.every(s=>sent(s.evaluation)===3),SAMPLES.filter(s=>sent(s.evaluation)!==3).map(s=>s.id).join());
 t('Empty card is rejected',Object.keys(cardErrors({name:'',oneLiner:'',problem:'',customer:'',solution:'',risk:'',price:0,customers:0})).length===8);
 t('Valid card passes validation',Object.keys(cardErrors({name:'Alpha',oneLiner:'A helpful tool for students',problem:'Bills cause stress',customer:'Students',solution:'An AI that helps',risk:'Little trust',price:4,customers:10})).length===0);
 const keep=Store.list();Store.write([]);
 const s1={...SAMPLES[0],id:'x1',sample:false,teamName:'Test',name:'T1'};
 Store.upsert({...s1});const u=Store.upsert({...s1});
 t('Resubmitting updates instead of duplicating',Store.list().length===1&&u===true&&Store.list()[0].revision===2);
 const rep=Store.merge([{...s1},{...s1,id:'x2'}]);
 t('Import skips duplicates by id and by content',Store.list().length===1&&rep.skipped===2,JSON.stringify(rep));
 const rep2=Store.merge([{id:'bad'},null,{...s1,id:'x3',name:'Other',original:'different'}]);
 t('Import rejects invalid entries and accepts new ones',rep2.invalid===2&&rep2.added===1,JSON.stringify(rep2));
 t('Sample teams are never imported as real',Store.merge([{...SAMPLES[0]}]).skipped===1);
 Store.write(keep);
 const R=rankList([{overall:7,collabScore:3},{overall:7,collabScore:5},{overall:8,collabScore:1}]);
 t('Ranking handles ties',R[0].r===1&&R[1].r===2&&R[2].r===2&&R[1].s.collabScore===5);
 const smp=SAMPLES[0],tam=rescore({...smp,scores:{problem:10,originality:10,ai:10,feasibility:10},overall:10,collabScore:10});
 t('Scores are recomputed from content, so tampered scores are ignored',tam.overall===smp.overall&&JSON.stringify(tam.scores)===JSON.stringify(smp.scores),tam.overall+' vs '+smp.overall);
 t('Compact submission fits the backend size limit',JSON.stringify(slim({...smp,problem:'x'.repeat(900),solution:'y'.repeat(900),original:'z'.repeat(900),revised:'w'.repeat(900),reflection:{improved:'a'.repeat(900),disagreed:'b'.repeat(900),human:'c'.repeat(900)}})).length<8800);
 t('Malformed remote entries are dropped',cleanRemote({id:1})===null&&cleanRemote({id:'a',name:'b',teamName:'c',ch:'nope'})===null);
 return T}
window.__ventureLabTests=runTests;
